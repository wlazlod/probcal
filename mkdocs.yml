site_name: probcal
site_description: Universal post-hoc probability calibration for binary classifiers — numpy-only.
site_url: https://wlazlod.github.io/probcal/
repo_url: https://github.com/wlazlod/probcal
repo_name: wlazlod/probcal

strict: true

# README.md is a contributor note (the snippet convention), not a built
# page — it would otherwise collide with index.md as the implicit index.
exclude_docs: |
  README.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: spacy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            signature_crossrefs: true
            show_signature_annotations: true
  - mkdocs-jupyter:
      include: ["notebooks/*.ipynb"]
      execute: false  # notebooks are committed executed

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      dedent_subsections: true
      check_paths: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Learn:
      - Install and quickstart: getting-started.md
      - How it works: how-it-works.md
      - "Tutorial: PD calibration walkthrough": notebooks/pd_calibration_walkthrough.ipynb
  - Guide:
      - Workflows:
          - Choose a calibrator: guide/choosing.md
          - Set cutoffs and invert maps: guide/cutoffs.md
          - Grouped evaluation: guide/groups.md
          - Monitor and act: guide/monitoring.md
          - Serialize and persist: guide/serialization.md
          - Build a validation report: guide/report.md
          - Auditability: guide/auditability.md
      - Integrations:
          - scikit-learn: guide/sklearn.md
          - optbinning scorecards: guide/optbinning.md
          - treecf counterfactuals: guide/treecf.md
  - Concepts:
      - Foundations:
          - Why calibration: concepts/why-calibration.md
          - Data splitting: concepts/data-splitting.md
      - Methods:
          - Parametric: concepts/methods-parametric.md
          - Nonparametric: concepts/methods-nonparametric.md
          - Distribution-free: concepts/methods-distribution-free.md
          - Offset: concepts/offset.md
          - Segmented calibration: concepts/segmented.md
      - Evaluation and diagnostics:
          - Metrics and tests: concepts/metrics.md
          - CORP and score decomposition: concepts/corp.md
          - Visualization: concepts/visualization.md
          - Automatic selection: concepts/auto-selection.md
      - Consuming and governing:
          - Inverse maps: concepts/inverse-maps.md
          - SHAP and calibration: concepts/shap-calibration.md
          - Conservatism and low-default portfolios: concepts/conservatism.md
          - Monitoring: concepts/monitoring.md
          - Serialization: concepts/serialization.md
  - Tutorials:
      - Full lifecycle on a rare-event portfolio: notebooks/pd_end_to_end.ipynb
  - Benchmarks:
      - Comparison: benchmarks/comparison.md
  - API reference:
      - Overview: api.md
      - Calibrators: api/calibrators.md
      - Metrics and tests: api/metrics.md
      - Tools: api/tools.md
      - API stability: api-stability.md
  - FAQ: faq.md
  - Changelog: changelog.md
